  const edit=i=>{const n=i<0,m=n?{name:'',icon:'grid',route:'dl',url:'',visible:true}:M[i];let ic0=m.icon;sheet(`<h2 style="font:600 24px var(--sf);margin-bottom:6px">${n?'Menu baru':'Edit menu'}</h2><input class="in" id="mn" placeholder="Nama menu" value="${esc(m.name)}" maxlength="30"><label class="lbl">Ikon</label><div class="chips" id="mi">${ICONS.map(x=>`<div class="chip ${x===ic0?'on':''}" data-ic="${x}" style="padding:0 12px">${ic(x,20)}</div>`).join('')}</div><label class="lbl">Buka halaman</label><select class="in" id="mr"><option value="">— pakai URL luar —</option>${ROUTES.map(r=>`<option value="${r[0]}" ${m.route===r[0]&&!m.url?'selected':''}>${r[1]}</option>`).join('')}</select><input class="in" id="mu" placeholder="https://… (jika memakai URL)" value="${esc(m.url||'')}"><div class="card row"><div><b>Tampilkan</b></div>${swc('mv',m.visible!==false)}</div>${cb(t('save'),'mk','s')}${n?'':`<div style="display:flex;gap:8px"><button class="cb s o" id="mup" style="flex:1">Naik</button><button class="cb s o" id="mdn" style="flex:1">Turun</button><button class="cb s d" id="mdl" style="flex:1">Hapus</button></div>`}`);
   $$('#mi [data-ic]').forEach(c=>c.onclick=()=>{ic0=c.dataset.ic;$$('#mi .chip').forEach(x=>x.classList.toggle('on',x===c))});
   $('#mk').onclick=()=>{const o={...m,name:$('#mn').value.trim(),icon:ic0,route:$('#mr').value,url:$('#mu').value.trim(),visible:$('#mv').checked};if(!o.name)return toast('Nama kosong','er');if(!o.route&&!/^https?:\/\//.test(o.url))return toast('Pilih halaman atau isi URL https://','er');n?M.push(o):M[i]=o;closeS();save()};
   if(!n){$('#mup').onclick=()=>{if(i>0){[M[i-1],M[i]]=[M[i],M[i-1]];closeS();save()}};$('#mdn').onclick=()=>{if(i<M.length-1){[M[i+1],M[i]]=[M[i],M[i+1]];closeS();save()}};$('#mdl').onclick=()=>{M.splice(i,1);closeS();save('Menu dihapus')}}};
  $('#ma').onclick=()=>edit(-1);draw()}};
V.admbanners={cls:'bare',html:()=>admBack('Banner',`<div class="card" style="padding:6px 18px 16px"><label class="lbl">Pergantian slide (detik)</label><input class="in" id="bi" type="number" min="2" max="30" value="${(CFG.bannerMs||5000)/1000}"><button class="cb s o" id="bis">Simpan interval</button></div><div id="bl" style="margin-top:12px">${skel(2)}</div>${cb('Tambah banner','ba','s')}<div id="bp" style="display:none;margin:6px 0"><div class="pb"><i id="bb"></i></div></div>`),
 async bind(){await loadCfg();let B=(CFG.banners||[]).map(x=>({...x}));const save=async()=>{try{await cfgSave({banners:B});B=CFG.banners.map(x=>({...x}));draw()}catch(e){toast(e.message,'er')}};
  const draw=()=>{$('#bl').innerHTML=B.map((b,i)=>`<div class="card" style="padding:12px;margin:10px 0"><div style="height:110px;border-radius:16px;overflow:hidden;margin-bottom:10px;background:#111">${b.type==='video'?`<video src="${mu(b.url)}" muted playsinline autoplay loop style="width:100%;height:100%;object-fit:cover"></video>`:`<img src="${mu(b.url)}" style="width:100%;height:100%;object-fit:cover">`}</div><div class="tabs" style="margin:0 0 8px">${[['home','Beranda'],['all','Semua halaman'],['off','Mati']].map(s=>`<button data-i="${i}" data-s="${s[0]}" class="${b.show===s[0]?'on':''}" style="font-size:12px">${s[1]}</button>`).join('')}</div><div style="display:flex;align-items:center;justify-content:space-between"><small style="color:var(--mu)">${b.type==='video'?'Video · ':''}Loop ${b.type==='video'?swc('l'+i,b.loop!==false):''}</small><button class="cb s d" data-x="${i}" style="margin:0;height:40px">Hapus</button></div></div>`).join('')||empty('Belum ada banner');
   $$('[data-s]').forEach(e=>e.onclick=()=>{B[+e.dataset.i].show=e.dataset.s;save()});$$('[data-x]').forEach(e=>e.onclick=()=>{B.splice(+e.dataset.x,1);save()});B.forEach((b,i)=>{const s=$('#l'+i);if(s)s.onchange=()=>{b.loop=s.checked;save()}})};
  $('#bis').onclick=async()=>{try{await cfgSave({bannerMs:+$('#bi').value*1000});toast('Tersimpan','ok')}catch(e){toast(e.message,'er')}};
  $('#ba').onclick=()=>{sheet(`<h2 style="font:600 24px var(--sf);margin-bottom:6px">Banner baru</h2><div class="card row rp" id="bu"><div class="ico">${ic('up')}</div><div><b>Unggah foto / video</b><small>Foto atau MP4/WebM, maks 80 MB</small></div></div><input type="file" id="bf" accept="image/*,video/mp4,video/webm" hidden><label class="lbl">atau tempel URL</label><input class="in" id="bur" placeholder="https://…/banner.mp4">${cb('Tambah dari URL','bk','s')}`);
   const add=(url)=>{B.push({type:/\.(mp4|webm)(\?|$)/i.test(url)?'video':'image',url,show:'home',loop:true});closeS();save()};$('#bu').onclick=()=>$('#bf').click();$('#bf').onchange=async e=>{const f=e.target.files[0];if(!f)return;closeS();$('#bp').style.display='block';try{const u=await upload('banner',f,p=>$('#bb').style.width=p*100+'%');add(u.url)}catch(x){toast(x.message,'er')}$('#bp').style.display='none'};$('#bk').onclick=()=>{const u=$('#bur').value.trim();if(!/^https?:\/\//.test(u))return toast('URL harus https://','er');add(u)}};draw()}};
V.admmaint={cls:'bare',html:()=>admBack('Maintenance',`<div class="card row"><div><b>Aktifkan maintenance</b><small>Hanya admin yang masih bisa masuk</small></div>${swc('mo',CFG.maintenance?.on)}</div><textarea class="in" id="mm" placeholder="Pesan untuk pengguna (opsional)">${esc(CFG.maintenance?.message||'')}</textarea>${cb(t('save'),'ms')}<button class="cb s o" id="mp" style="width:100%">Pratinjau halaman</button>`),
 bind(){$('#ms').onclick=async()=>{try{await cfgSave({maintenance:{on:$('#mo').checked,message:$('#mm').value}});toast($('#mo').checked?'Maintenance aktif untuk semua pengguna':'Website kembali normal','ok')}catch(e){toast(e.message,'er')}};$('#mp').onclick=()=>{CFG.maintenance={...CFG.maintenance,message:$('#mm').value};nav('maint:preview')}}};
V.admbcast={cls:'bare',html:()=>admBack('Siaran',`<input class="in" id="bt" placeholder="Judul" maxlength="80"><textarea class="in" id="bb" placeholder="Isi pesan" maxlength="400"></textarea>${cb('Kirim ke semua pengguna','bs')}`),bind(){$('#bs').onclick=async()=>{try{await api('/api/admin/broadcast',{json:{title:$('#bt').value,body:$('#bb').value}});$('#bt').value=$('#bb').value='';toast('Terkirim','ok')}catch(e){toast(e.message,'er')}}}};
V.admgroups={cls:'bare',html:()=>admBack('Grup chat',`<div id="gl">${skel(2)}</div><input class="in" id="gn" placeholder="Nama grup baru" maxlength="40">${cb('Buat grup','gs','s')}`),bind(){const load=async()=>{try{const j=await api('/api/chats');$('#gl').innerHTML=j.chats.filter(c=>c.type==='group').map(c=>`<div class="card row"><div class="ico">${ic('users')}</div><div><b>${esc(c.name)}</b></div><button class="cb s d" data-x="${c.id}" style="margin:0;height:40px">Hapus</button></div>`).join('')||empty();$$('[data-x]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus grup dan semua pesannya?'))return;try{await api('/api/admin/groups/'+b.dataset.x,{method:'DELETE'});load()}catch(e){toast(e.message,'er')}})}catch(e){$('#gl').innerHTML=empty(e.message)}};load();$('#gs').onclick=async()=>{try{await api('/api/admin/groups',{json:{name:$('#gn').value}});$('#gn').value='';load()}catch(e){toast(e.message,'er')}}}};
function listAdmin(title,key,fields,fmt){return {cls:'bare',html:()=>admBack(title,`<div id="al">${skel(3)}</div>${cb('Tambah','aa','s')}`),async bind(){await loadCfg();let L=(CFG[key]||[]).map(x=>({...x}));const save=async()=>{try{await cfgSave({[key]:L});L=CFG[key].map(x=>({...x}));draw();toast('Tersimpan','ok')}catch(e){toast(e.message,'er')}};
 const draw=()=>{$('#al').innerHTML=L.map((m,i)=>`<div class="card row">${fmt(m)}<button class="ib" data-x="${i}" style="width:40px;height:40px">${ic('trash',18)}</button></div>`).join('')||empty();$$('[data-x]').forEach(b=>b.onclick=()=>{L.splice(+b.dataset.x,1);save()})};
 $('#aa').onclick=()=>{sheet(`<h2 style="font:600 24px var(--sf);margin-bottom:6px">Tambah ${title.toLowerCase()}</h2>${fields.map(f=>`<input class="in" id="f_${f[0]}" placeholder="${f[1]}">`).join('')}${key==='walls'?`<div class="card row rp" id="fu"><div class="ico">${ic('up')}</div><div><b>atau unggah gambar</b><small>maks 15 MB</small></div></div><input type="file" id="ff" accept="image/*" hidden>`:''}${cb(t('save'),'fk','s')}`);
  $('#fk').onclick=()=>{const o={};fields.forEach(f=>o[f[0]]=$('#f_'+f[0]).value.trim());if(!/^https?:\/\//.test(o.url||''))return toast('URL harus https://','er');L.push(o);closeS();save()};if(key==='walls'){$('#fu').onclick=()=>$('#ff').click();$('#ff').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{toast('Mengunggah…');const u=await upload('wall',f);L.push({name:$('#f_name').value.trim()||f.name.slice(0,20),url:u.url});closeS();save()}catch(x){toast(x.message,'er')}}}};draw()}}}
V.admmusic=listAdmin('Musik','music',[['title','Judul lagu'],['artist','Artis'],['url','URL file audio (mp3/m4a)']],m=>`<div class="ico">${ic('music')}</div><div><b>${esc(m.title)}</b><small>${esc(m.artist)}</small></div>`);

V.admfw={cls:'bare',html:()=>admBack('Firewall',`<p style="color:var(--mu);font-size:13px;margin:0 4px 10px">IP yang terdeteksi menyerang atau memindai website otomatis diblokir. Blokir berulang menjadi makin lama.</p><div id="fl">${skel(2)}</div><input class="in" id="fi" placeholder="Blokir IP manual, mis. 203.0.113.9">${cb('Blokir 24 jam','fb','s')}`),
 bind(){const load=async()=>{try{const j=await api('/api/admin/firewall');$('#fl').innerHTML=j.bans.map(b=>`<div class="card row"><div class="ico">${ic('shield')}</div><div><b>${esc(b.ip)}</b><small>sampai ${new Date(b.until).toLocaleString()} · pelanggaran ke-${b.offenses}</small></div><button class="cb s o" data-x="${esc(b.ip)}" style="margin:0;height:40px">Buka</button></div>`).join('')||empty('Tidak ada IP yang diblokir');$$('[data-x]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/firewall',{json:{action:'unban',ip:b.dataset.x}});load()}catch(e){toast(e.message,'er')}})}catch(e){$('#fl').innerHTML=empty(e.message)}};load();$('#fb').onclick=async()=>{try{await api('/api/admin/firewall',{json:{action:'ban',ip:$('#fi').value.trim(),hours:24}});$('#fi').value='';load()}catch(e){toast(e.message,'er')}}}};
V.admlogs={cls:'bare',html:()=>admBack('Log aktivitas','<div id="lg">'+skel(5)+'</div>'),async bind(){try{const j=await api('/api/admin/logs');$('#lg').innerHTML=j.items.map(l=>`<div class="card row"><div><b>${esc(l.action)}</b><small>${esc(l.actor)} · ${esc(l.detail)}</small></div><small>${ago(l.at)}</small></div>`).join('')||empty()}catch(e){$('#lg').innerHTML=empty(e.message)}}};
V.admsec={cls:'bare',html:()=>admBack('Keamanan',`<div class="card" style="padding:6px 18px 18px"><label class="lbl">Ganti password panel</label><input class="in" id="po" type="password" placeholder="Password panel lama"><input class="in" id="pn" type="password" placeholder="Password panel baru (min. 8)">${cb(t('save'),'pk','s')}</div><div style="margin-top:10px">${row('refresh','Keluarkan semua pengguna','Semua sesi login di semua perangkat dibatalkan','',`id="rs"`)}${row('db','Unduh backup','Seluruh database (ZIP)','',`id="bk"`)}<div class="card row"><div><b>Sertakan file media</b><small>Foto, video, dan file pengguna (bisa besar)</small></div>${swc('bm',false)}</div></div>`),
 bind(){$('#pk').onclick=async()=>{try{await api('/api/admin/panel-password',{json:{old:$('#po').value,new:$('#pn').value}});$('#po').value=$('#pn').value='';toast('Password panel diganti','ok')}catch(e){toast(e.message,'er')}};
 $('#rs').onclick=async()=>{if(!confirm('Semua pengguna harus login ulang. Lanjutkan?'))return;try{const j=await api('/api/admin/reset-sessions',{json:{}});TOKEN=j.token;LS.s('jf_t',TOKEN);toast('Semua sesi direset','ok')}catch(e){toast(e.message,'er')}};
 $('#bk').onclick=async()=>{toast('Menyiapkan backup…');try{const r=await fetch(BASE+'/api/admin/backup'+($('#bm').checked?'?media=1':''),{headers:{Authorization:'Bearer '+TOKEN,'X-Admin-Token':sessionStorage.getItem('jf_at')||''}});if(!r.ok)throw new Error('Gagal membuat backup');const bl=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='jayforyou-backup'+(bl.type.includes('zip')?'.zip':'.json');a.click();toast('Backup diunduh','ok')}catch(e){toast(e.message,'er')}}}};
